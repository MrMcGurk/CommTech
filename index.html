<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showdown Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=Playfair+Display&family=Roboto+Slab:wght@700&family=Pacifico&family=Bungee&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* Layout: one file, two roles. The host screen is a projector stage; the player screen is a big-button answer pad. */
:root{
  --ink:#121019; --panel:#1c1826; --panel2:#251f33; --line:#352d48;
  --text:#f5f2fb; --muted:#a69dba;
  --lime:#e1ff2e; --violet:#a865ff; --orange:#ff7a1a; --cyan:#33e3d3;
  --good:#3ddc84; --bad:#ff5468;
  --display:'Anton','Impact','Arial Narrow Bold',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.brand span{background:var(--lime);color:var(--ink);padding:0 6px;margin-left:6px}
.status{font-size:13px;color:var(--muted)}
.status.bad{color:var(--bad)}
.btn{background:var(--lime);color:var(--ink);border:none;border-radius:10px;font-weight:700;font-size:18px;padding:14px 24px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px}
.center{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px;text-align:center}
.center h1{font-size:clamp(52px,12vw,104px);line-height:.9}
.center h1 .hl{background:var(--lime);color:var(--ink);padding:0 .08em;display:inline-block;margin-top:.06em}
.center h2{font-size:clamp(40px,9vw,72px)}
.center p{margin:0;color:var(--muted)}
.big-input{background:var(--panel);border:3px solid var(--lime);border-radius:12px;color:var(--text);font:700 clamp(28px,7vw,44px) var(--body);padding:12px 16px;text-align:center;width:100%;letter-spacing:.08em}
.big-input:focus{outline:none;box-shadow:0 0 0 4px rgba(225,255,46,.25)}
.err{color:var(--bad);font-weight:700;min-height:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 16px var(--body)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opts label{display:flex;flex-direction:column;gap:6px;text-align:left}

/* projector */
.stage{display:flex;flex-direction:column;gap:18px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .spacer{flex:1}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px}
.code-card{background:var(--panel);border:3px solid var(--lime);border-radius:16px;padding:20px;text-align:center}
.code-card .code{font-family:var(--display);font-size:clamp(80px,16vw,170px);line-height:1;letter-spacing:.06em;color:var(--lime)}
.code-card .url{font-size:clamp(16px,2.4vw,24px);word-break:break-all}
.lobby-count{font-family:var(--display);font-size:72px;line-height:1;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{background:var(--panel2);border-radius:99px;padding:8px 16px;font-weight:700;font-size:20px;animation:pop .35s ease-out}
.chips span.off{opacity:.4}
.q{font-size:clamp(28px,4.6vw,58px);font-weight:700;line-height:1.15;text-align:center;text-wrap:balance;margin:0}
.clock{font-family:var(--display);font-size:56px;line-height:1;width:100px;height:100px;border-radius:50%;border:6px solid var(--lime);display:grid;place-items:center;flex:none}
.clock.low{border-color:var(--bad);color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-align:left;border:none;border-radius:12px;padding:18px;min-height:96px;font-weight:700;font-size:clamp(18px,2.4vw,28px);color:#121019;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.ans .sh{font-size:30px;width:34px;text-align:center;flex:none}
.ans .cnt{margin-left:auto;font-family:var(--display);font-size:34px}
.ans .fill{position:absolute;left:0;bottom:0;height:10px;background:rgba(18,16,25,.55)}
.a0{background:var(--lime)}.a1{background:var(--violet)}.a2{background:var(--orange)}.a3{background:var(--cyan)}
.ans.dim{opacity:.25}
.ans.right{outline:5px solid var(--good);outline-offset:3px}
.why{background:var(--panel2);border-left:5px solid var(--good);border-radius:6px;padding:14px 16px;font-size:20px;margin:0}
.vis{display:flex;justify-content:center;max-width:100%}
.vis .sw{width:80px;height:80px;max-width:20vw}
.vis .sw:first-child{border-radius:8px 0 0 8px}.vis .sw:last-child{border-radius:0 8px 8px 0}
.vis .ftxt{font-size:clamp(40px,8vw,80px);line-height:1.2}
.vis .pair{font-family:var(--display);font-size:clamp(34px,7vw,64px);padding:12px 28px;border-radius:8px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:820px;width:100%;align-self:center}
.board li{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--panel);border-radius:10px;padding:12px 18px;font-size:26px;font-weight:700}
.board li .rk{font-family:var(--display);font-size:32px;color:var(--muted)}
.board li:first-child{background:var(--lime);color:var(--ink)}
.board li:first-child .rk{color:var(--ink)}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .dl{font-size:18px;color:var(--good)}
.board li:first-child .dl{color:var(--ink)}
/* finale: podium blocks rise one at a time, 3rd → 2nd → 1st */
.finale{position:relative}
.finale::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 75%,rgba(225,255,46,.10),transparent 70%);pointer-events:none}
.announce{font-family:var(--display);font-size:clamp(40px,7vw,84px);line-height:1;text-align:center;text-transform:uppercase;min-height:1.1em;margin-top:2vh}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:min(56vh,480px);position:relative}
.podium .slot{flex:1;max-width:260px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.podium .who{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transform:translateY(30px) scale(.6);transition:opacity .5s .55s,transform .6s .55s cubic-bezier(.2,1.6,.4,1);text-align:center;max-width:100%}
.podium .who .em{font-size:clamp(56px,9vw,104px);line-height:1.1}
.podium .who .nm{font-weight:700;font-size:clamp(20px,2.6vw,30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.podium .who .sc{color:var(--muted);font-size:18px}
.podium .block{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:14px;color:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .7s cubic-bezier(.2,1.2,.4,1)}
.podium .block b{font-family:var(--display);font-size:clamp(48px,7vw,80px);line-height:1}
.podium .p1 .block{background:var(--lime);height:min(30vh,260px)}
.podium .p2 .block{background:var(--cyan);height:min(22vh,190px)}
.podium .p3 .block{background:var(--orange);height:min(15vh,130px)}
.podium .slot.show .block{transform:scaleY(1)}
.podium .slot.show .who{opacity:1;transform:none}
.podium .slot.lit .block{box-shadow:0 0 0 4px var(--lime),0 0 80px 10px rgba(225,255,46,.55);animation:glow 1.4s ease-in-out infinite alternate}
.podium .slot.lit .who .em{animation:bounce 1s ease-in-out infinite}
@keyframes glow{to{box-shadow:0 0 0 4px var(--lime),0 0 120px 24px rgba(225,255,46,.75)}}
@keyframes bounce{50%{transform:translateY(-12px)}}
.drum{font-size:clamp(90px,26vw,150px);line-height:1.1;animation:shake .18s linear infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.setpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.setbtn{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left}
.setbtn b{font-family:var(--display);font-size:clamp(26px,4vw,36px);font-weight:400;text-transform:uppercase;line-height:1}
.setbtn .muted{font-size:14px}
.setbtn[aria-pressed="true"]{border-color:var(--lime);background:var(--panel2)}
@media (max-width:520px){.setpick{grid-template-columns:1fr}}

/* mascot picker */
.mascots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.masc{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,border-color .12s}
.masc .em{font-size:48px;line-height:1.1}
.masc .nm{font-weight:700;font-size:15px}
.masc:hover:not([disabled]){transform:translateY(-3px);border-color:var(--lime)}
.masc[disabled]{opacity:.3;cursor:default}
.masc.chosen{opacity:1;border-color:var(--lime);background:var(--panel2)}
.chips span{font-size:24px}

/* player pad */
.pad{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.pad .who{display:flex;justify-content:space-between;font-weight:700}
.pad .answers{grid-template-columns:repeat(2,minmax(0,1fr))}
.pad .ans{min-height:clamp(120px,24vh,200px);flex-direction:column;justify-content:center;text-align:center;gap:6px;font-size:16px}
.pad .ans .sh{font-size:44px;width:auto}
.pad .pq{font-size:18px;font-weight:700;margin:0}
.verdict{font-family:var(--display);font-size:clamp(60px,16vw,110px);line-height:1;text-transform:uppercase}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.pts{font-family:var(--display);font-size:48px;color:var(--lime)}
.rank{font-size:24px;font-weight:700}
.muted{color:var(--muted);margin:0}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@media (max-width:600px){.answers{grid-template-columns:1fr}.pad .answers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.mascot{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:none}
.mascot svg{display:block;overflow:hidden;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:4px 16px 4px 6px}
.nm{display:inline-flex;align-items:center;gap:8px;min-width:0}
.board li .nm{display:flex}
.podium .who .em svg{width:clamp(84px,12vw,150px);height:auto}
.masc .em{font-size:0}
.masc:hover:not([disabled]) .mascot svg{animation:wiggle .5s ease-in-out}
.pad .who .me{display:inline-flex;align-items:center;gap:8px}
.bigmascot svg{width:min(180px,46vw);height:auto;animation:bounce 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (max-width:600px){.mascots{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}}</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">BVG<span id="brandName">SHOWDOWN LIVE</span></div>
    <span class="status" id="status"></span>
  </div>
  <main id="app"></main>
</div>
<canvas id="fx" hidden></canvas>

(() => {

function emitter(){ const h={}; return { on:(e,f)=>{ (h[e]=h[e]||[]).push(f); }, emit:(e,...a)=>{ (h[e]||[]).slice().forEach(f=>{ try{ f(...a); }catch(err){ console.error(err); } }); } }; }

class Conn {
  constructor(owner, remote, cid){
    const ev=emitter(); this._ev=ev; this.peer=remote; this.cid=cid; this._owner=owner;
    this.open=false; this.closed=false; this._q=[];
  }
  on(e,f){ this._ev.on(e,f); return this; }
  _post(k,d){ const m={from:this._owner.id, cid:this.cid, k}; if(d!==undefined) m.d=d; return fdb.ref("inbox/"+this.peer).push(m); }
  _setOpen(){ if(this.open||this.closed) return; this.open=true; this._ev.emit("open"); const q=this._q; this._q=[]; q.forEach(m=>this.send(m)); }
  send(msg){ if(this.closed) return; if(!this.open){ this._q.push(msg); return; } this._post("data", JSON.stringify(msg)); }
  // Close this side if the other device's presence disappears (tab closed, network lost).
  _watch(){ const r=fdb.ref("peers/"+this.peer); let seen=false; const cb=s=>{ if(s.exists()) seen=true; else if(seen) this._close(); }; r.on("value",cb); this._unwatch=()=>r.off("value",cb); }
  _close(){ if(this.closed) return; this.closed=true; this.open=false; if(this._unwatch) this._unwatch(); this._owner.conns.delete(this.cid); this._ev.emit("close"); }
  close(){ if(this.closed) return; try{ this._post("close"); }catch{} this._close(); }
}

class Peer {
  constructor(id){
    const ev=emitter(); this._ev=ev;
    this.id=id||("p-"+rid()); this.open=false; this.destroyed=false; this.conns=new Map(); this._offs=[];
    const me=fdb.ref("peers/"+this.id), inbox=fdb.ref("inbox/"+this.id);
    // A host claims its game code; if someone already has it, pick another code.
    const claim = id ? me.once("value").then(s=>{ if(s.exists()) throw {type:"unavailable-id"}; }) : Promise.resolve();
    claim.then(()=>{
      if(this.destroyed) return;
      let down=false;
      const info=fdb.ref(".info/connected");
      const infoCb=s=>{
        if(this.destroyed) return;
        if(s.val()!==true){ if(this.open&&!down){ down=true; this._ev.emit("disconnected"); } return; }
        me.onDisconnect().remove(); inbox.onDisconnect().remove();
        me.set(Date.now()).then(()=>{

          if(!this.open){ this.open=true; this._ev.emit("open",this.id); }
          else if(down){ down=false; [...this.conns.values()].forEach(c=>c._close()); this._ev.emit("reconnected"); }
        }).catch(e=>this._ev.emit("error",{type:"network",message:String(e&&e.message||e)}));
      };

      inbox.on("child_added",inCb); this._offs.push(()=>inbox.off("child_added",inCb));

    if(!m||!m.cid) return;
    let c=this.conns.get(m.cid);
    if(m.k==="open"){            // a student is connecting to this host
      if(c) return;
      c=new Conn(this, String(m.from), m.cid); this.conns.set(m.cid,c);
      c._watch(); this._ev.emit("connection",c); c._post("ack"); c._setOpen();

    }
    if(!c) return;
    if(m.k==="ack") return c._setOpen();
    if(m.k==="close") return c._close();
    if(m.k==="data"){ let d; try{ d=JSON.parse(m.d); }catch{ return; } c._ev.emit("data",d); }
  }
  connect(target){
    const c=new Conn(this, target, rid()); this.conns.set(c.cid,c);

      c._watch(); c._post("open");
    }).catch(e=>this._ev.emit("error",{type:"network",message:String(e&&e.message||e)}));

  }
  reconnect(){ /* Firebase reconnects by itself */ }
  destroy(){
    if(this.destroyed) return; this.destroyed=true; this.open=false;
    [...this.conns.values()].forEach(c=>c.close()); this._offs.forEach(f=>f());
    try{ fdb.ref("peers/"+this.id).onDisconnect().cancel(); fdb.ref("peers/"+this.id).remove(); fdb.ref("inbox/"+this.id).remove(); }catch{}
  }
}

  const ps=[...H.players.values()].filter(p=>p.online), n=ps.filter(p=>p.answers[H.i]).length;
  a.textContent=`${n}/${ps.length} answered`;
  if(ps.length && n>=ps.length) hostReveal();
}
function ranked(){ return [...H.players.values()].sort((a,b)=>b.score-a.score); }
function hostReveal(){
  if(H.phase!=="question") return;
  cancelAnimationFrame(H.raf); H.phase="reveal";
  const q=H.qs[H.i], list=ranked();
  for(const p of H.players.values()){
    if(!p.answers[H.i]){ p.streak=0; p.delta=0; }
    const rank=list.indexOf(p)+1, ahead=rank>1?list[rank-2]:null;
    send(p,{t:"result", ok:!!(p.last&&p.last.ok), answered:!!p.last, pts:p.delta, score:p.score, streak:p.streak, rank, total:list.length, correct:q.c, behind: ahead?ahead.name:null, gap: ahead?ahead.score-p.score:0});
  }
  sfx.buzz(); renderHost();
}
function endMsg(p){ const list=ranked(); return {t:"end", rank:list.indexOf(p)+1, total:list.length, score:p.score}; }
// Phones show a drumroll screen until the projector has revealed 1st place.
function hostEnd(){
  H.phase="end"; H.revealed=false;
  for(const p of H.players.values()) send(p,{t:"suspense"});
  renderHost();
}
function clearTimers(){ H.timers.forEach(clearTimeout); H.timers=[]; stopMusic(); }
function drumroll(ms){ drumrollSfx(ms); }
function finishReveal(){
  if(H.revealed) return; H.revealed=true; clearTimers();
  document.querySelectorAll(".podium .slot").forEach(s=>s.classList.add("show"));
  const ann=$("announce"); if(ann) ann.textContent="Congratulations!";
  const rest=$("podRest"); if(rest) rest.hidden=false;
  const ctl=$("podCtl"); if(ctl) ctl.hidden=false;
  const skip=$("podSkip"); if(skip) skip.hidden=true;
  for(const p of H.players.values()) send(p,endMsg(p));
}
function runReveal(list){
  clearTimers();
  const ann=$("announce"), slots=[...document.querySelectorAll(".podium .slot")];
  const at=(ms,fn)=>H.timers.push(setTimeout(fn,ms));
  const say=txt=>{ ann.textContent=txt; ann.classList.remove("pop"); void ann.offsetWidth; ann.classList.add("pop"); };
  const words=["And the winner is…","In second place…","In third place…"];
  let t=900;
  for(const idx of [2,1,0]){
    if(!list[idx]) continue;
    const win=idx===0, slot=slots.find(s=>s.dataset.rank===String(idx+1));
    at(t,()=>{ say(words[idx]); drumroll(win?2600:1300); });
    t+= win?2900:1500;
    at(t,()=>{
      slot.classList.add("show"); say(list[idx].name+"!");
      if(win){ slot.classList.add("lit"); confetti(); sfx.end(); } else sfx.place();
    });
    t+= win?1800:1700;
  }
  at(t,finishReveal);
}
function tiles(q, reveal){
  const grid=el("div","answers"), ci=q.opts.indexOf(q.c);
  const counts=q.opts.map((_,i)=>[...H.players.values()].filter(p=>p.answers[H.i]&&p.answers[H.i].c===i).length);
  const max=Math.max(1,...counts);
  q.opts.forEach((o,i)=>{
    const t=el("div","ans a"+i); t.append(el("span","sh",SHAPES[i]), el("span",null,o));
    if(reveal){ t.append(el("span","cnt num",String(counts[i]))); const f=el("span","fill"); f.style.width=(counts[i]/max*100)+"%"; t.append(f); t.classList.add(i===ci?"right":"dim"); }
    grid.append(t);
  });
  return grid;
}
function renderHost(){
  cancelAnimationFrame(H.raf); app.textContent="";
  const st=el("div","stage"); app.append(st);
  const bar=el("div","bar");
  const deckName=SETS[H.set].name+" · "+(SETS[H.set].decks.find(d=>d[0]===H.deck)||[,""])[1];
  bar.append(el("span","pill",deckName), el("span","pill num","Code "+H.code));
  if(H.phase==="question"||H.phase==="reveal"||H.phase==="board") bar.append(el("span","pill num",`Question ${H.i+1} of ${H.qs.length}`));
  bar.append(el("span","spacer"));
  const mute=btn(muted?"Sound: off":"Sound: on","btn ghost",()=>{ muted=!muted; mute.textContent=muted?"Sound: off":"Sound: on"; if(muted) stopMusic(); else if(H.phase==="lobby") startMusic(); }); mute.style.padding="8px 14px"; mute.style.fontSize="14px"; bar.append(mute);
  st.append(bar);

  if(H.phase==="lobby"){
    if(!music && !muted) startMusic();
    const card=el("div","code-card");
    const url=location.href.split("#")[0];
    card.append(el("div","label","Join at"), el("div","url",url), el("div","label","with game code"), el("div","code num",H.code));
    st.append(card);
    const ps=[...H.players.values()];
    st.append(el("div","lobby-count num",String(ps.filter(p=>p.online).length)), el("p","muted",ps.length===1?"team waiting":"teams waiting"));
    const ch=el("div","chips"); ps.forEach(p=>{ const s=el("span",p.online?"":"off"); s.append(mascotEl(p.mascot,40),p.name); ch.append(s); }); st.append(ch);
    const row=el("div","row"); const go=btn("Start game","btn",hostStart); go.style.fontSize="24px"; if(!ps.length) go.disabled=true; row.append(go); st.append(row);
    return;
  }
  const q=H.qs[H.i];
  if(H.phase==="question"){
    const row=el("div","bar");
    const clock=el("div","clock num",String(H.secs)); clock.id="hClock";
    const ans=el("span","pill num","0/0 answered"); ans.id="hAns";
    row.append(clock, ans, el("span","spacer"), btn("Skip timer","btn ghost",hostReveal));
    st.append(row, el("p","q",q.q)); const v=visFor(q); if(v) st.append(v);
    st.append(tiles(q,false));
    updateAnswered();
    let lastSec=H.secs;
    const tick=()=>{
      if(H.phase!=="question") return;
      const left=Math.max(0,H.secs-(performance.now()-H.t0)/1000), sec=Math.ceil(left);
      const c=$("hClock"); if(!c) return;
      c.textContent=String(sec); c.classList.toggle("low",left<5);
      if(sec<lastSec&&sec<5) sfx.tick(sec); lastSec=sec;
      if(left<=0) return hostReveal();
      H.raf=requestAnimationFrame(tick);
    };
    H.raf=requestAnimationFrame(tick);
    return;
  }
  if(H.phase==="reveal"){
    st.append(el("p","q",q.q), tiles(q,true));
    const why=el("p","why"); why.append(el("b",null,q.c+". "), q.why); st.append(why);
    const row=el("div","row"); const b=btn("Show scoreboard","btn",()=>{ H.phase="board"; renderHost(); }); row.append(b); st.append(row); b.focus();
    return;
  }
  if(H.phase==="board"){
    st.append(el("h2",null,"Scoreboard"));
    const ol=el("ol","board");
    ranked().slice(0,5).forEach((p,i)=>{ const li=el("li","pop"); li.append(el("span","rk num",String(i+1)), nameTag(p), el("span","dl num",p.delta?"+"+fmt(p.delta):""), el("span","num",fmt(p.score))); ol.append(li); });
    st.append(ol);
    const last=H.i+1>=H.qs.length;
    const row=el("div","row"); const b=btn(last?"Final podium":"Next question","btn",nextQuestion); b.style.fontSize="22px"; row.append(b); st.append(row); b.focus();
    return;
  }
  if(H.phase==="end"){
    const list=ranked();
    st.classList.add("finale");
    const ann=el("div","announce pop","The results are in…"); ann.id="announce"; st.append(ann);
    const pod=el("div","podium");
    for(const [cls,idx] of [["p2",1],["p1",0],["p3",2]]){
      const p=list[idx]; if(!p) continue;
      const m=MASCOT_BY[p.mascot];
      const slot=el("div","slot "+cls); slot.dataset.rank=String(idx+1);
      const who=el("div","who"); who.append(mascotEl(p.mascot,150,"em"), el("span","nm",m?m.name:p.name), el("span","num sc",fmt(p.score)+" pts"));
      const block=el("div","block"); block.append(el("b",null,String(idx+1)));
      slot.append(who,block); pod.append(slot);
    }
    st.append(pod);
    const rest=el("div"); rest.id="podRest"; rest.hidden=true;
    if(list.length>3){ const ol=el("ol","board"); list.slice(3,10).forEach((p,i)=>{ const li=el("li"); li.append(el("span","rk num",String(i+4)), nameTag(p), el("span"), el("span","num",fmt(p.score))); ol.append(li); }); rest.append(ol); }
    st.append(rest);
    const skip=btn("Skip to results","linkbtn",finishReveal); skip.id="podSkip"; skip.style.alignSelf="center"; st.append(skip);
    const row=el("div","row"); row.id="podCtl"; row.hidden=true;
    row.append(btn("New game","btn",()=>{ clearTimers(); try{ H.peer.destroy(); }catch{} H.players=new Map(); hostSetup(); }));
    st.append(row);
    if(H.revealed) finishReveal(); else runReveal(list);
  }
}
document.addEventListener("keydown",e=>{
  if(!H.peer || e.target.tagName==="INPUT" || e.target.tagName==="BUTTON" || e.target.tagName==="SELECT") return;
  if(e.key!=="Enter" && e.key!==" ") return;
  e.preventDefault();
  if(H.phase==="lobby"&&H.players.size) hostStart();
  else if(H.phase==="question") hostReveal();
  else if(H.phase==="reveal"){ H.phase="board"; renderHost(); }
  else if(H.phase==="board") nextQuestion();
});

// =====================================================================
// PLAYER (student device)
// =====================================================================
const P = { peer:null, conn:null, code:"", name:"", mascot:"", key:store.get("psl-key",""), score:0, q:null, phase:"code", t0:0, raf:0 };
if(!P.key){ P.key=Math.random().toString(36).slice(2)+Date.now().toString(36); store.set("psl-key",P.key); }

function playerCode(err){
  P.phase="code"; app.textContent="";
  const box=el("div","center");
  const h=el("h1"); h.append("Showdown",el("br"),Object.assign(el("span","hl"),{textContent:"Live"}));
  box.append(h, el("p",null,"Enter the game code on the big screen."));
  const inp=el("input","big-input"); inp.id="code"; inp.inputMode="numeric"; inp.autocomplete="off"; inp.maxLength=6; inp.placeholder="Game code"; inp.value=P.code;
  const e=el("div","err",err||""); e.setAttribute("role","alert");
  const go=btn("Enter","btn",()=>{ const c=inp.value.replace(/\D/g,""); if(c.length!==6){ e.textContent="The code is 6 digits."; inp.focus(); return; } P.code=c; go.disabled=true; go.textContent="Connecting…"; P.phase="connecting"; connect(); });
  inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter") go.click(); });
  box.append(inp,e,go, btn("I'm the teacher: host a game","linkbtn",hostSetup));
  app.append(box); inp.focus();
}
function playerPick(taken, note){
  P.phase="pick"; app.textContent="";
  const box=el("div","center"); box.style.maxWidth="760px";
  box.append(el("div","label","Game "+P.code), el("h2",null,"Pick your mascot"), el("p",null,"Your team plays as this animal. Grey ones are already taken."));
  if(note){ const n=el("div","err",note); n.setAttribute("role","alert"); box.append(n); }
  const grid=el("div","mascots");
  for(const [id,emoji,name] of MASCOTS){
    const isTaken=taken.includes(id);
    const b=btn(null,"masc",()=>{ grid.querySelectorAll("button").forEach(x=>x.disabled=true); b.classList.add("chosen"); try{ P.conn.send({t:"join",mascot:id,key:P.key}); }catch{} });
    b.append(mascotEl(id,72,"em"), el("span","nm",isTaken?"Taken":name));
    b.setAttribute("aria-label", name+(isTaken?" (taken)":""));
    if(isTaken) b.disabled=true;
    grid.append(b);
  }
  box.append(grid, btn("Wrong code? Go back","linkbtn",()=>{ try{ P.conn&&P.conn.close(); }catch{} P.conn=null; playerCode(); }));
  app.append(box);
}
let joinTimer=0;
function connect(){
  if(!peerReady()) return;
  status("Connecting…");
  clearTimeout(joinTimer);
  joinTimer=setTimeout(()=>{ if(P.phase==="connecting"){ playerCode("Couldn't reach that game. Check the code, or ask your teacher if the game is open."); status("",false); } },12000);
  const go=()=>{
    const conn=P.peer.connect(PREFIX+P.code,{reliable:true, serialization:"json"});
    P.conn=conn;
    conn.on("open",()=>{ conn.send({t:"hello",key:P.key}); });
    conn.on("data",onHostMsg);
    conn.on("close",()=>{ if(P.phase!=="end"){ status("Lost connection. Reconnecting…",true); setTimeout(()=>{ if(P.conn===conn) go(); },1500); } });
  };
  if(P.peer && !P.peer.destroyed && P.peer.open) return go();
  if(P.peer) try{ P.peer.destroy(); }catch{}
  P.peer=new Peer(undefined, PEER_OPTS);
  P.peer.on("open",go);
  P.peer.on("disconnected",()=>{ try{ P.peer.reconnect(); }catch{} });
  P.peer.on("error",e=>{
    if(e.type==="peer-unavailable"){ clearTimeout(joinTimer); if(P.phase==="connecting"||P.phase==="code"){ status("",false); playerCode("No game with that code is open. Check the code on the big screen."); } else { status("The game isn't reachable right now. Retrying…",true); setTimeout(()=>{ if(P.phase!=="code") go(); },2500); } return; }
    status("Connection problem: "+(e.type||"unknown"),true);
  });
}
function onHostMsg(d){
  if(!d||typeof d!=="object") return;
  clearTimeout(joinTimer);
  status("Connected");
  if(typeof d.quiz==="string") brand(d.quiz.slice(0,40));
  if(d.t==="suspense") return playerSuspense();
  if(d.t==="mascots"){
    if(d.ended){ playerCode("That game has ended. Ask your teacher for the new code."); return; }
    if(P.phase==="connecting"||P.phase==="pick") playerPick(Array.isArray(d.taken)?d.taken.map(String):[], P.pendingNote);
    P.pendingNote=""; return;
  }
  if(d.t==="taken"){ P.pendingNote="Another team just grabbed that one. Pick a different animal."; return; }
  if(d.t==="welcome"){
    const m=MASCOT_BY[d.mascot]; P.mascot=m?m.id:""; P.name=m?m.label:"Your team"; P.score=Number(d.score)||0;
    if(P.phase==="connecting"||P.phase==="pick"||P.phase==="code") playerWait(); return;
  }
  if(d.t==="q") return playerQuestion(d);
  if(d.t==="locked") return playerLocked();
  if(d.t==="result") return playerResult(d);
  if(d.t==="end") return playerEnd(d);
}
function header(){ const w=el("div","who"); const n=el("span","me"); n.append(mascotEl(P.mascot,34),P.name); w.append(n, el("span","num",fmt(P.score)+" pts")); return w; }
function nameTag(p){ const s=el("span","nm"); s.append(mascotEl(p.mascot,36),p.name); return s; }
function playerWait(){
  P.phase="wait"; app.textContent="";
  const box=el("div","pad");
  const m=MASCOT_BY[P.mascot];
  const big=mascotEl(P.mascot,180,"pop bigmascot");
  box.append(header(), big, el("div","verdict ok pop","You're in!"), el("p","rank","You're Team "+(m?m.name:"")+". Look for your mascot on the big screen."), el("p","muted","The game starts when your teacher hits Start."));
  app.append(box);
}
function playerQuestion(d){
  if(!Array.isArray(d.opts)) return;
  P.phase="q"; P.q=d; cancelAnimationFrame(P.raf); app.textContent="";
  const box=el("div","pad");
  box.append(header(), el("div","label",`Question ${Number(d.i)+1} of ${Number(d.n)}`), el("p","pq",String(d.q||"")));
  const v=visFor({v:d.v}); if(v) box.append(v);
  const bar=el("div"); bar.style.cssText="height:10px;background:var(--panel);border-radius:99px;overflow:hidden"; const fill=el("div"); fill.style.cssText="height:100%;background:var(--lime);transform-origin:left"; bar.append(fill); box.append(bar);
  const grid=el("div","answers");
  d.opts.slice(0,4).forEach((o,i)=>{
    const b=btn(null,"ans a"+i,()=>{ grid.querySelectorAll("button").forEach(x=>x.disabled=true); try{ P.conn.send({t:"ans",i:d.i,c:i}); }catch{} sfx.lock(); playerLocked(SHAPES[i]); });
    b.append(el("span","sh",SHAPES[i]), el("span",null,String(o))); grid.append(b);
  });
  box.append(grid); app.append(box);
  const secs=Number(d.secs)||20, start=performance.now()-(secs-(Number(d.left)||secs))*1000;
  const tick=()=>{ if(P.phase!=="q") return; const left=Math.max(0,secs-(performance.now()-start)/1000); fill.style.transform=`scaleX(${left/secs})`; if(left<=0){ grid.querySelectorAll("button").forEach(x=>x.disabled=true); return; } P.raf=requestAnimationFrame(tick); };
  P.raf=requestAnimationFrame(tick);
}
function playerLocked(shape){
  if(P.phase==="locked") return;
  P.phase="locked"; cancelAnimationFrame(P.raf); app.textContent="";
  const box=el("div","pad");
  box.append(header(), el("div","verdict pop", shape?shape:"Locked"), el("p","rank","Answer locked in"), el("p","muted","Waiting for the other teams…"));
  app.append(box);
}
function playerResult(d){
  P.phase="result"; cancelAnimationFrame(P.raf); P.score=Number(d.score)||0; app.textContent="";
  const box=el("div","pad");
  box.append(header());
  if(d.ok){ box.append(el("div","verdict ok pop","Correct"), el("div","pts num","+"+fmt(d.pts))); sfx.right(); if(d.streak>=2) box.append(el("p","rank","Answer streak: "+d.streak)); }
  else { box.append(el("div","verdict no pop", d.answered?"Incorrect":"Time's up")); box.append(el("p","rank","Answer: "+String(d.correct||""))); sfx.wrong(); }
  box.append(el("p","rank",`You're in ${ordinal(Number(d.rank)||0)} place`));
  if(d.behind) box.append(el("p","muted",`${fmt(d.gap)} points behind ${clean(d.behind)}`));
  app.append(box);
}
function playerSuspense(){
  P.phase="suspense"; cancelAnimationFrame(P.raf); app.textContent="";
  const box=el("div","pad");
  const drum=el("div","drum","🥁");
  box.append(mascotEl(P.mascot,90), drum, el("div","verdict","Drumroll…"), el("p","rank","Eyes on the big screen!"), el("p","muted","Your final place appears here after the podium reveal."));
  app.append(box);
}
function playerEnd(d){
  P.phase="end"; cancelAnimationFrame(P.raf); P.score=Number(d.score)||0; app.textContent="";
  const box=el("div","pad"), r=Number(d.rank)||0;
  box.append(header(), el("div","label","Final results"), el("div","verdict ok pop",ordinal(r)), el("p","rank",fmt(P.score)+" points"), el("p","muted",`out of ${Number(d.total)||0} teams`));
  if(r && r<=3){ confetti(); sfx.end(); }
  box.append(btn("Play another game","btn ghost",()=>{ try{ P.conn.close(); }catch{} P.conn=null; P.code=""; P.score=0; playerCode(); }));
  app.append(box);
}

// ---------- start ----------
function landing(){ if(location.hash==="#host") hostSetup(); else playerCode(); }
landing();
})();
